name: release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run unit tests
        run: dotnet test GrabadorReuniones.sln -c Release --nologo

      - name: Publish single-file executable (win-x64)
        run: |
          dotnet publish src/GrabadorReuniones/GrabadorReuniones.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:DebugType=none `
            -o dist/win-x64

      - name: Package ZIP archive
        run: |
          Compress-Archive -Path dist/win-x64/GrabadorReuniones.exe -DestinationPath dist/win-x64/GrabadorReuniones-win-x64.zip -Force

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/win-x64/GrabadorReuniones.exe
            dist/win-x64/GrabadorReuniones-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
